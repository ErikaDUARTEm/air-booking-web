<div class="modal-overlay">
    <div class="modal-container">
      <div class="modal-content">
        <button class="close-button" (click)="onClose()">
          <span class="close-icon">✕</span>
        </button>
        
        <div class="modal-body">
          <div class="modal-left">
            <h2 class="modal-title">¿Confirmar asiento seleccionado?</h2>
          </div>
          
          <div class="modal-right">
            <div class="warning-container">
              <div class="warning-icon">⚠️</div>
              <p class="warning-text">
                Has seleccionado el asiento {{seatInfo}}. Una vez confirmado, podría aplicarse un cargo por cambios posteriores.
              </p>
            </div>
            
            <p class="suggestion-text">
              Te recomendamos revisar tu selección antes de confirmar.
            </p>
          </div>
        </div>
        
        <div class="modal-footer">
          <button class="btn btn-cancel" (click)="onCancel()">
            Cancelar selección
          </button>
          <button class="btn btn-confirm" (click)="onConfirm()">
            Confirmar asiento
          </button>
        </div>
      </div>
    </div>
  </div>
